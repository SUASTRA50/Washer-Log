<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Operational Laundry</title>
    <!-- Tailwind CSS untuk Tampilan -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js & PapaParse -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header & Filter -->
        <div class="bg-white p-6 rounded-xl shadow-sm flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Dashboard Laundry</h1>
                <p class="text-sm text-gray-500">Monitoring Operasional & Penggunaan Chemical</p>
            </div>
            
            <!-- 1. Filter Range Tanggal -->
            <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border">
                <div>
                    <label class="block text-xs text-gray-500 font-semibold">TGL MULAI</label>
                    <input type="date" id="startDate" class="bg-transparent text-sm font-medium border-b border-gray-300 focus:outline-none">
                </div>
                <span class="text-gray-400 font-bold">-</span>
                <div>
                    <label class="block text-xs text-gray-500 font-semibold">TGL SELESAI</label>
                    <input type="date" id="endDate" class="bg-transparent text-sm font-medium border-b border-gray-300 focus:outline-none">
                </div>
                <button onclick="processData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                    Filter
                </button>
            </div>
        </div>

        <!-- 5. Kpi Total Pencucian -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-blue-600 text-white p-6 rounded-xl shadow-sm">
                <h3 class="text-sm font-medium uppercase tracking-wider opacity-80">Total Pencucian</h3>
                <div class="flex items-baseline mt-2">
                    <span id="totalKg" class="text-4xl font-extrabold">0</span>
                    <span class="ml-2 text-xl font-semibold">Kg</span>
                </div>
            </div>
        </div>

        <!-- Layout Grid Grafik & Tabel -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- 2. Top 10 Karyawan/User -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Top 10 Pencuci Perbanyak (Kg)</h2>
                <div class="relative h-64">
                    <canvas id="topUsersChart"></canvas>
                </div>
            </div>

            <!-- 6. Pencucian per Mesin -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Total Load per Mesin (Kg)</h2>
                <div class="relative h-64">
                    <canvas id="machineChart"></canvas>
                </div>
            </div>

            <!-- 3. Ranking Program Pencucian -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Ranking Program Pencucian</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b text-xs text-gray-400 font-semibold uppercase">
                                <th class="py-2">Rank</th>
                                <th class="py-2">Program</th>
                                <th class="py-2 text-right">Frekuensi Dipakai</th>
                            </tr>
                        </thead>
                        <tbody id="programTable" class="text-sm divide-y">
                            <!-- Data diisi oleh JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 4. Ranking Chemical (mL & Rupiah) -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Ranking Penggunaan Chemical</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b text-xs text-gray-400 font-semibold uppercase">
                                <th class="py-2">Rank</th>
                                <th class="py-2">Chemical</th>
                                <th class="py-2 text-right">Volume (mL)</th>
                                <th class="py-2 text-right">Biaya (Rp)</th>
                            </tr>
                        </thead>
                        <tbody id="chemicalTable" class="text-sm divide-y">
                            <!-- Data diisi oleh JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 7. Salin URL CSV dari Google Sheets (File > Share > Publish to web > CSV)
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1TnNnD7OwZ2P8yhglFioUY8dX262f1Zy2EEBkgW0GYMQ/edit?gid=267019814#gid=267019814';

        // Daftar Harga Chemical per mL (Silakan sesuaikan nilai harganya)
        const HARGA_CHEMICAL_PER_ML = {
            'Detergent': 15, // Contoh Rp 15 / mL
            'Softener': 10,  // Contoh Rp 10 / mL
            'Bleach': 20     // Contoh Rp 20 / mL
        };

        let rawData = [];
        let topUsersChart, machineChart;

        // Fetch Data Langsung dari Sheet
        async function loadSheetData() {
            if (GOOGLE_SHEET_CSV_URL.includes('PASTE_URL')) {
                alert('Harap masukkan URL CSV Google Sheets pada variabel GOOGLE_SHEET_CSV_URL di dalam kode.');
                return;
            }
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    rawData = results.data;
                    processData();
                }
            });
        }

        function extractKgFromMachineName(machineName) {
            if (!machineName) return 0;
            const match = machineName.match(/\d+/);
            return match ? parseInt(match[0], 10) : 0;
        }

        function processData() {
            const startVal = document.getElementById('startDate').value;
            const endVal = document.getElementById('endDate').value;
            
            const startDate = startVal ? new Date(startVal) : null;
            const endDate = endVal ? new Date(endVal) : null;

            // Filter data berdasarkan range tanggal
            const filteredData = rawData.filter(row => {
                if (!row.Tanggal) return false;
                const rowDate = new Date(row.Tanggal);
                if (startDate && rowDate < startDate) return false;
                if (endDate && rowDate > endDate) return false;
                return true;
            });

            // Variable penampung agregasi
            let totalKg = 0;
            const users = {};
            const machines = {};
            const programs = {};
            const chemicals = {};

            filteredData.forEach(row => {
                const machineName = row['Nama Mesin'] || row['Mesin'] || '';
                const kg = extractKgFromMachineName(machineName);
                const user = row['Nama'] || row['Operator'] || 'Unknown';
                const program = row['Program'] || 'Unknown';
                const chemName = row['Chemical'] || '';
                const chemVol = parseFloat(row['Volume_mL'] || row['Chemical_mL'] || 0);

                // 5. Total Kg
                totalKg += kg;

                // 2. Top Users (Kg)
                users[user] = (users[user] || 0) + kg;

                // 6. Kg per Mesin
                if (machineName) {
                    machines[machineName] = (machines[machineName] || 0) + kg;
                }

                // 3. Program
                if (program) {
                    programs[program] = (programs[program] || 0) + 1;
                }

                // 4. Chemical
                if (chemName) {
                    chemicals[chemName] = (chemicals[chemName] || 0) + chemVol;
                }
            });

            // Update UI
            document.getElementById('totalKg').innerText = totalKg.toLocaleString('id-ID');
            renderTopUsersChart(users);
            renderMachineChart(machines);
            renderProgramTable(programs);
            renderChemicalTable(chemicals);
        }

        function renderTopUsersChart(users) {
            const sorted = Object.entries(users).sort((a,b) => b[1] - a[1]).slice(0, 10);
            const labels = sorted.map(i => i[0]);
            const data = sorted.map(i => i[1]);

            if (topUsersChart) topUsersChart.destroy();
            const ctx = document.getElementById('topUsersChart').getContext('2d');
            topUsersChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Total Kg', data: data, backgroundColor: '#3B82F6' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderMachineChart(machines) {
            const labels = Object.keys(machines);
            const data = Object.values(machines);

            if (machineChart) machineChart.destroy();
            const ctx = document.getElementById('machineChart').getContext('2d');
            machineChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{ data: data, backgroundColor: ['#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderProgramTable(programs) {
            const sorted = Object.entries(programs).sort((a,b) => b[1] - a[1]);
            const tbody = document.getElementById('programTable');
            tbody.innerHTML = sorted.map((item, idx) => `
                <tr>
                    <td class="py-2 font-semibold text-gray-500">#${idx + 1}</td>
                    <td class="py-2 font-medium">${item[0]}</td>
                    <td class="py-2 text-right font-bold text-gray-700">${item[1]}x</td>
                </tr>
            `).join('');
        }

        function renderChemicalTable(chemicals) {
            const sorted = Object.entries(chemicals)
                .map(([name, vol]) => {
                    const pricePerMl = HARGA_CHEMICAL_PER_ML[name] || 0;
                    return { name, vol, cost: vol * pricePerMl };
                })
                .sort((a,b) => b.vol - a.vol);

            const tbody = document.getElementById('chemicalTable');
            tbody.innerHTML = sorted.map((item, idx) => `
                <tr>
                    <td class="py-2 font-semibold text-gray-500">#${idx + 1}</td>
                    <td class="py-2 font-medium">${item.name}</td>
                    <td class="py-2 text-right">${item.vol.toLocaleString('id-ID')} mL</td>
                    <td class="py-2 text-right font-bold text-emerald-600">Rp ${item.cost.toLocaleString('id-ID')}</td>
                </tr>
            `).join('');
        }

        // Jalankan saat load
        window.onload = loadSheetData;
    </script>
</body>
</html>
